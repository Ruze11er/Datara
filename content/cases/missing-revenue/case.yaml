# Data Detective Academy, Case #001: The Missing Revenue.
# The leads (investigation questions) are in leads.yaml. The data is generated by scripts/case-data/missing-revenue.mjs.
# Every number this file states about the data is pinned by an assertion at the bottom, so verify fails if the
# data and the story ever disagree. Never rename a published id (case, hypothesis, evidence, document, option).

id: missing-revenue
number: "001"
title: The Missing Revenue
version: 1
rank: 1
summary: Copperleaf Home's revenue fell 32% in a month, and the CEO already has a suspect. Find out what really happened.
recommendedTraining: SQL Lab chapters 1–5 (filtering, aggregates, GROUP BY and HAVING, joins). Guided mode helps with the rest.
company: Copperleaf Home

dataset:
  id: missing-revenue-v1
  file: cases/missing-revenue-v1.sql
  hiddenFile: cases/missing-revenue-v1-hidden.sql

tables:
  - name: orders
    description: One row per order placed on the website, July 2024 to September 2025.
    columns:
      order_id: Order number. Numbers follow the time the order was placed.
      customer_id: The customer who placed the order (see customers).
      ordered_at: Date and time the order was placed, like 2025-08-12 14:03:22.
      channel: "How the customer arrived: Paid Search, Social, Email, Organic Search or Direct (last click)."
      status: "completed, cancelled or refunded. Finance counts only completed orders as revenue."
      payment_ref: Reference from the payment provider. One per charge.
      order_total: Total value of the order in dollars (the sum of its lines).
  - name: order_items
    description: One row per product in an order.
    columns:
      order_item_id: Line number.
      order_id: The order this line belongs to.
      product_id: The product (see products).
      quantity: Units bought.
      unit_price: Price of one unit when the order was placed.
  - name: products
    description: Everything Copperleaf Home sells.
    columns:
      product_id: Product number.
      product_name: Name shown on the website.
      category: Product category, e.g. Kitchen Appliances or Bedding.
      price: Current price in dollars.
  - name: customers
    description: Everyone with an account.
    columns:
      customer_id: Customer number.
      first_name: First name.
      last_name: Last name.
      email: Email address (empty for some customers).
      city: City.
      signup_date: Date the account was created.
  - name: inventory_snapshots
    description: Units in stock for every product at the end of each day. The warehouse system keeps only August and September 2025.
    columns:
      snapshot_date: The day, like 2025-09-14.
      product_id: The product.
      units_in_stock: Units left at the end of that day.
  - name: marketing_monthly
    description: Marketing spend and website visits per channel and month.
    columns:
      month: Month, like 2025-09.
      channel: Marketing channel (same names as orders.channel).
      spend: Money spent on the channel that month, in dollars.
      sessions: Website visits that arrived through the channel.

briefing: |
  The rain hasn't stopped since Monday, and neither has the phone.

  Copperleaf Home sells pans, pillows and espresso machines to half the country. On Friday its finance team
  put a number on the CEO's desk: **revenue down 32%** in a single month. By lunchtime the CEO had a suspect.
  On 1 September the marketing team changed its plan, and the CEO wants to know how badly that hurt.

  Everybody has a theory. Nobody has checked. That's where you come in, rookie.

  You get the data: every order, every product, every visit. Treat each theory as a suspect and each query as
  a question in the interrogation room. Don't trust the dashboard. Don't trust the CEO. Trust what the data
  can prove.

  Bring me the truth, and bring me the evidence to back it.

  *Chief Inspector R. Vance, Data Detective Academy*

objectives:
  - Reproduce the reported drop, so you know what you're explaining.
  - Check whether the data behind the report can be trusted.
  - Break the drop down to find where the money went.
  - Test the CEO's theory about the marketing change.
  - Deliver a verdict backed by evidence, with a recommendation.

cast:
  - id: chief
    name: Chief Inspector R. Vance
    role: Head of the Data Detective Academy
  - id: ceo
    name: Dana Whitlock
    role: CEO, Copperleaf Home
  - id: marketing
    name: Marcus Bell
    role: Marketing Manager, Copperleaf Home
  - id: finance
    name: Lena Brooks
    role: Finance Analyst, Copperleaf Home
  - id: ops
    name: Priya Nair
    role: Operations Lead, Copperleaf Home
  - id: it
    name: Sam Okafor
    role: IT Support, Copperleaf Home

hypotheses:
  - id: h-campaign
    title: The marketing change drove customers away
    source: ceo
    truth: ruled-out
    explanation: >-
      Channels the campaign never touched (Email, Organic Search, Direct) fell as much as the total, spend was
      flat, and visits rose. The campaign moved orders from Paid Search to Social; it didn't lose them.
  - id: h-seasonal
    title: September is always a slow month
    source: finance
    truth: ruled-out
    explanation: >-
      September is a little quieter than August (about 6% lower in 2024), but nowhere near a 25–32% fall.
  - id: h-spending
    title: Customers are spending less across the board
    source: marketing
    truth: ruled-out
    explanation: >-
      Only Kitchen Appliances collapsed. Every other category moved by a normal September amount, so customers
      in general were not tightening their belts.
  - id: h-product
    title: Something went wrong with specific products
    truth: cause
    explanation: >-
      The three best-selling kitchen appliances were out of stock for all of September after a supplier
      shipment was held at port. Their revenue vanished, and many customers who came for one left without
      ordering anything.
  - id: h-data
    title: The report overstates the drop
    truth: contributor
    explanation: >-
      A payment-retry bug recorded 85 August orders twice. August looked bigger than it was, so the real drop is
      about 25%, not 32%.

documents:
  - id: doc-dashboard
    title: Monthly revenue report, September 2025
    from: finance
    kind: report
    body: |
      **Revenue (completed orders)**

      | Month | Revenue |
      |---|---|
      | August 2025 | $106,531.50 |
      | September 2025 | $72,419.50 |
      | **Change** | **−32.0%** |

      Prepared automatically from the orders system. Lena Brooks, Finance.
  - id: doc-ceo-email
    title: "Re: September numbers"
    from: ceo
    kind: email
    body: |
      Thirty-two percent. In one month.

      Marketing changed the plan on 1 September and sales fell off a cliff. I don't think that's a coincidence.
      I want to know how much damage the new campaign did, and I want it before the board meeting.

      Dana
  - id: doc-marketing-memo
    title: Fall campaign budget change
    from: marketing
    kind: memo
    body: |
      From 1 September we're moving about 40% of the Paid Search budget into the new Fall Social campaign.
      **Total marketing spend stays the same.** Email, Organic Search and Direct are not affected.

      Marcus Bell, Marketing
  - id: doc-seasonal-note
    title: A thought on September
    from: finance
    kind: note
    body: |
      Before anyone panics: September is usually quieter. Back-to-school, end of summer. Could be just that.

      Lena
  - id: doc-incident
    title: "Incident INC-2291: duplicate charges"
    from: it
    kind: note
    unlockedBy: lead-duplicate-payments
    body: |
      **Status:** fixed 19 August, 17:40

      Between 12 and 19 August the payment gateway retried charges that timed out. In some cases the retry went
      through **and** created a second order with the same payment reference. Customers were charged twice.
      Refunds are being processed, but the orders system has not been corrected yet.

      Sam Okafor, IT Support
  - id: doc-supplier
    title: "Fwd: Kessler shipment delay"
    from: ops
    kind: email
    unlockedBy: lead-stockouts
    body: |
      Forwarding this. We ran out at the start of September and the website shows "sold out" for all three.

      > Our container with your Aurora espresso machines, Copperleaf stand mixers and AeroCrisp air fryers has
      > been held at the port since 20 August. Estimated delivery: 20 October. We apologise for the delay.
      > (Kessler Home Appliances)

      Priya

evidence:
  # Claims: what people said. Available from the start. Not proof.
  - id: cl-ceo
    title: "The CEO's theory"
    kind: claim
    from: ceo
    summary: "\"Marketing changed the plan on 1 September and sales fell off a cliff.\""
    relations: { h-campaign: supports }
    key: false
  - id: cl-marketing
    title: "Marketing's defence"
    kind: claim
    from: marketing
    summary: "\"Total spend stays the same. We moved money between channels, we didn't cut it.\""
    relations: { h-campaign: contradicts }
    key: false
  - id: cl-finance
    title: "Finance's hunch"
    kind: claim
    from: finance
    summary: "\"September is usually quieter. Could be just that.\""
    relations: { h-seasonal: supports }
    key: false
  # Facts: each one is produced by a lead, from the learner's own query result.
  - id: ev-reported-drop
    title: The drop is real arithmetic
    kind: fact
    summary: Completed orders brought in $106,531.50 in August and $72,419.50 in September. The dashboard adds up correctly.
    relations: {}
    key: false
  - id: ev-last-year
    title: Last September was normal
    kind: fact
    summary: In 2024, September was about 6% below August. A seasonal dip exists, but it's nowhere near 32%.
    relations: { h-seasonal: contradicts }
    key: true
  - id: ev-duplicate-payments
    title: 85 charges recorded twice
    kind: fact
    summary: 85 payment references appear on two orders each, all placed between 12 and 19 August 2025.
    relations: { h-data: supports }
    key: true
  - id: ev-corrected-drop
    title: The real drop is about 25%
    kind: fact
    summary: Counting each payment once, August was $97,038.50, not $106,531.50. September is about 25% below the true August.
    relations: { h-data: supports }
    key: true
  - id: ev-orders-basket
    title: Smaller baskets
    kind: fact
    summary: Orders fell by about 10%, but the average order fell further, from about $112 to $93 (duplicates removed).
    relations: { h-spending: supports, h-product: supports }
    key: false
  - id: ev-categories
    title: One category collapsed
    kind: fact
    summary: Kitchen Appliances revenue fell 85%. Every other category fell between 4% and 14%, close to a normal September.
    relations: { h-product: supports, h-spending: contradicts, h-campaign: contradicts }
    key: true
  - id: ev-stockouts
    title: Three best-sellers sold out
    kind: fact
    summary: The Aurora Espresso Machine, Copperleaf Stand Mixer and AeroCrisp Air Fryer had zero stock on all 30 days of September.
    relations: { h-product: supports }
    key: true
  - id: ev-channels
    title: Untouched channels fell too
    kind: fact
    summary: >-
      Email, Organic Search and Direct, which the campaign never touched, fell by 21–28%, as much as the shop as a
      whole. Paid Search fell and Social rose; together they fell about 25%.
    relations: { h-campaign: contradicts }
    key: true
  - id: ev-traffic
    title: Visitors kept coming
    kind: fact
    summary: Marketing spend was about the same in September, and website visits rose by about 3%.
    relations: { h-campaign: contradicts }
    key: true
  - id: ev-test-orders
    title: Staff test orders
    kind: fact
    summary: 3 staff test accounts placed 12 orders worth $275 in total. A real data problem, but far too small to matter.
    relations: { h-data: supports }
    key: false

manual:
  - id: mc-break-it-down
    title: Break the total apart
    body: |
      Revenue = **number of orders × average order value**. When revenue moves, check which part moved. Fewer
      orders and smaller orders have very different causes.
    lessons: [sql-aggregates, fund-analysis-process]
    check:
      question: Revenue fell 20%, but the number of orders stayed the same. What must have happened?
      options: [The average order got smaller, More customers placed orders, Nothing changed]
      answer: 0
      explanation: If the number of orders didn't change, each order must be worth less on average.
  - id: mc-like-with-like
    title: Compare like with like
    body: |
      Many businesses have seasons: some months are always busier than others. Before calling a change unusual,
      compare it with **the same period last year**.
    lessons: [sql-dates]
    check:
      question: "Sales fell 10% from November to January. What's the fairest comparison?"
      options: [November to January a year earlier, January to February, The best month ever]
      answer: 0
      explanation: The same months a year earlier show how big the normal seasonal change is.
  - id: mc-check-the-data
    title: Check the data before you trust it
    body: |
      Reports are only as good as the data behind them. Before explaining a change, look for **duplicates**,
      missing days, test records and changed definitions. Sometimes the "problem" is in the report itself.
    lessons: [sql-having, py-cleaning-data]
    check:
      question: "A report shows a sudden spike in orders on one day. What should you check first?"
      options: [Whether some orders were recorded twice, Which ad ran that day, The weather]
      answer: 0
      explanation: Rule out data problems first. Otherwise you may end up explaining something that never happened.
  - id: mc-control-group
    title: Look for a control group
    body: |
      If someone blames a change that only touched **part** of the business, look at the parts it didn't touch.
      If they moved just as much, the change can't be the main cause. Two things happening at the same time
      doesn't mean one caused the other.
    lessons: [stats-correlation]
    check:
      question: A new ad ran only in Canada, and sales fell in every country. Is the ad the likely cause?
      options: ["No: the countries without the ad fell too", "Yes: sales fell after the ad started", "Yes: Canada is a big market"]
      answer: 0
      explanation: The countries without the ad act as a control group. They fell too, so something else is going on.

verdict:
  theory:
    hypothesis: h-campaign
    question: What does the evidence say about the CEO's theory that the marketing change caused the drop?
    options:
      - id: th-confirmed
        text: "It's confirmed: the drop started on the day the campaign changed."
        score: 0
        feedback: >-
          Timing alone proves nothing. The campaign changed on 1 September and the appliances sold out on
          2 September. Two things happening together doesn't mean one caused the other.
      - id: th-not-supported
        text: "It's not supported: channels the campaign never touched fell just as much, and visits held up."
        score: 5
        feedback: You used the untouched channels as a control group to test the theory. That's exactly how to check a claim like this.
      - id: th-partly
        text: "It's partly right: the campaign caused about half of the drop."
        score: 0
        feedback: Nothing in the data supports "half". Paid Search and Social together fell no more than the untouched channels.
      - id: th-unknown
        text: "We can't say anything about the campaign without more data."
        score: 2
        feedback: >-
          A careful instinct, and the campaign's long-term effect is still unknown. But there's enough evidence to
          rule it out as the cause of this drop.
  citations: { min: 2, max: 4 }
  recommendations:
    question: Which actions do you recommend? Choose three.
    pick: 3
    options:
      - id: rec-restock
        text: Get the three appliances back in stock as fast as possible (another supplier or air freight), and email customers when they're back.
        score: 3
        feedback: This goes after the real cause directly.
      - id: rec-fix-duplicates
        text: Correct the duplicated August orders, finish the refunds, and restate August revenue.
        score: 3
        feedback: Fixing the data stops the next report from overstating the problem, and the customers charged twice get their money back.
      - id: rec-stock-alerts
        text: Add a stock-out alert to the weekly report, so empty shelves on best-sellers are caught within days.
        score: 2
        feedback: Good process thinking. The problem would have been spotted weeks earlier.
      - id: rec-evaluate-later
        text: Evaluate the new campaign properly once stock is back to normal.
        score: 1
        feedback: Reasonable. With the stock-out mixed in, September can't tell you how good the campaign is.
      - id: rec-revert-campaign
        text: Move the budget back to Paid Search immediately.
        score: 0
        feedback: That treats a cause the evidence rules out, and the stock problem would remain.
      - id: rec-cut-budget
        text: Cut the marketing budget until sales recover.
        score: 0
        feedback: Visitors kept coming. Cutting marketing would lose customers without fixing the empty shelves.
  limitations:
    question: Which limitations should your report mention? Choose all that apply.
    target: 2
    options:
      - id: lim-one-month
        text: There's only one month of data since the campaign change, so its long-term effect is unknown.
        valid: true
        feedback: Right. The campaign isn't the cause of this drop, but one month can't tell you whether it works.
      - id: lim-lost-demand
        text: The data can't show exactly how many sales the stock-out lost, because nobody records visitors who leave a sold-out page.
        valid: true
        feedback: Right. The lost revenue is an estimate. Product page views would make it more precise.
      - id: lim-inventory-history
        text: Stock data only goes back to August 2025, so earlier stock-outs can't be checked.
        valid: true
        feedback: Right. You can't compare with earlier stock problems.
      - id: lim-attribution
        text: Channel is the customer's last click, so it may not show every channel that influenced a purchase.
        valid: true
        feedback: Right. Last-click attribution simplifies the customer's path.
      - id: lim-too-small
        text: With only a few thousand orders, the dataset is too small to draw any conclusion.
        valid: false
        feedback: Thousands of orders is plenty to see an 85% collapse in one category. Don't hide behind the sample size.
      - id: lim-timing
        text: Because the drop began when the campaign did, the campaign must share some of the blame.
        valid: false
        feedback: That's not a limitation, it's a correlation-causation mistake. The control group already answered this.
  pushback:
    - id: pb-paid-search
      from: ceo
      challenge: "\"Paid Search revenue fell by half in September. How is that not the campaign's fault?\""
      options:
        - id: pb1-shift
          text: Budget moved from Paid Search to Social, so orders moved with it. Together the two fell about 25%, the same as the channels the campaign never touched.
          score: 2
          feedback: You defended the conclusion with the control group. Compare like with like.
        - id: pb1-agree
          text: You're right. The campaign caused the Paid Search drop, and that's the main problem.
          score: 0
          feedback: Paid Search fell because its budget went to Social. Look at both channels together.
        - id: pb1-ignore
          text: Paid Search is too small to matter.
          score: 0
          feedback: Paid Search is one of the biggest channels. The answer is that Social gained what Paid Search lost.
    - id: pb-orders
      from: marketing
      challenge: "\"If it's a stock problem, why did the number of orders fall too?\""
      options:
        - id: pb2-left
          text: Many customers came for an espresso machine, mixer or air fryer, found it sold out and left without buying anything.
          score: 2
          feedback: Right. A missing best-seller loses whole orders, not just lines.
        - id: pb2-duplicates
          text: Partly because August's order count included the duplicated orders.
          score: 1
          feedback: True, but even with duplicates removed, orders fell about 10%. Customers leaving sold-out pages explains the rest.
        - id: pb2-campaign
          text: Because the new campaign brought fewer visitors.
          score: 0
          feedback: Visits actually rose about 3% in September.
  modelSummary: |
    **September revenue fell about 25%, not 32%, and the marketing change did not cause it.**

    - **Data problem:** a payment bug recorded 85 August orders twice, overstating August by about $9,500.
      Corrected, the drop is about 25%.
    - **Main cause:** the Aurora Espresso Machine, Copperleaf Stand Mixer and AeroCrisp Air Fryer were out of
      stock all September (supplier delay). Kitchen Appliances revenue fell 85%; other categories saw a normal
      September dip.
    - **Not the cause:** channels the campaign never touched fell just as much, spend was flat and visits rose.

    **Recommendations:** restock the three appliances urgently and notify waiting customers; correct the
    duplicated orders and restate August; add stock-out alerts to the weekly report. Evaluate the campaign
    once stock is normal. One month is too little to judge it.
  summaryChecklist:
    - Says how big the drop really is, after fixing the data.
    - Names the main cause and the evidence for it.
    - Says clearly whether the CEO's theory holds, and why.
    - Recommends actions that address the cause.
    - Mentions at least one limitation.
    - Fits in about five sentences a busy CEO would read.

scoring:
  dataQualityLeads: [lead-duplicate-payments, lead-corrected-revenue]
  linksTarget: 6
  citationsTarget: 3

debrief:
  story: |
    Here's what happened at Copperleaf Home.

    On **20 August** a container of espresso machines, stand mixers and air fryers got stuck at the port. The
    shop sold its last units on 1 September. From **2 September** the website showed "sold out" on its three
    best-selling appliances, and it stayed that way all month. Many customers who came for one of them left
    without buying anything.

    Meanwhile, back on **12 August**, a payment bug had started recording some orders twice. IT fixed it a week
    later, but nobody corrected the data, so the September report compared a real month with an inflated one.

    And on **1 September** marketing moved budget from Paid Search to Social. The timing made it the obvious
    suspect. But orders simply came in through Social instead of Paid Search, and the channels the campaign
    never touched fell just as hard.

    The CEO had a suspect. The data had an alibi.
  career: |
    This is the most common request a data analyst gets: "a number dropped, find out why". The moves you used
    here carry over to almost any job:

    - **Reproduce the number** before explaining it.
    - **Check the data** for duplicates and gaps.
    - **Break the total down** (orders × average order, then by segment) until the problem has an address.
    - **Test the popular theory** with a control group instead of arguing about it.
    - **Answer in a few sentences** with evidence, actions and limitations.

assertions:
  # Numbers quoted in the documents and evidence above.
  - id: dashboard-august
    description: The dashboard's August revenue
    query: SELECT SUM(order_total) FROM orders WHERE status = 'completed' AND substr(ordered_at, 1, 7) = '2025-08'
    practice: { equals: 106531.5 }
  - id: dashboard-september
    description: The dashboard's September revenue
    query: SELECT SUM(order_total) FROM orders WHERE status = 'completed' AND substr(ordered_at, 1, 7) = '2025-09'
    practice: { equals: 72419.5 }
  - id: reported-drop
    description: The reported drop is 32% (and a different number on the hidden data, so typed-in answers fail)
    query: |
      SELECT 1 - (SELECT SUM(order_total) FROM orders WHERE status = 'completed' AND substr(ordered_at, 1, 7) = '2025-09')
               / (SELECT SUM(order_total) FROM orders WHERE status = 'completed' AND substr(ordered_at, 1, 7) = '2025-08')
    practice: { min: 0.315, max: 0.325 }
    hidden: { min: 0.27, max: 0.31 }
  - id: corrected-august
    description: August revenue with each payment counted once
    query: |
      SELECT SUM(order_total) FROM orders
      WHERE status = 'completed' AND substr(ordered_at, 1, 7) = '2025-08'
        AND order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref)
    practice: { equals: 97038.5 }
  - id: true-drop
    description: The real drop (duplicates removed) is about 25%
    query: |
      WITH r AS (SELECT substr(ordered_at, 1, 7) AS m, SUM(order_total) AS v FROM orders
                 WHERE status = 'completed' AND order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref) GROUP BY m)
      SELECT 1 - (SELECT v FROM r WHERE m = '2025-09') / (SELECT v FROM r WHERE m = '2025-08')
    practice: { min: 0.245, max: 0.26 }
    hidden: { min: 0.18, max: 0.32 }
  - id: last-year
    description: September 2024 was about 6% below August 2024
    query: |
      SELECT 1 - (SELECT SUM(order_total) FROM orders WHERE status = 'completed' AND substr(ordered_at, 1, 7) = '2024-09')
               / (SELECT SUM(order_total) FROM orders WHERE status = 'completed' AND substr(ordered_at, 1, 7) = '2024-08')
    practice: { min: 0.055, max: 0.07 }
    hidden: { min: -0.05, max: 0.1 }
  - id: duplicate-count
    description: 85 payment references were recorded twice
    query: SELECT COUNT(*) FROM (SELECT payment_ref FROM orders GROUP BY payment_ref HAVING COUNT(*) = 2)
    practice: { equals: 85 }
    hidden: { min: 10 }
  - id: no-triplicates
    description: No payment reference appears more than twice
    query: SELECT COUNT(*) FROM (SELECT payment_ref FROM orders GROUP BY payment_ref HAVING COUNT(*) > 2)
    practice: { equals: 0 }
    hidden: { equals: 0 }
  - id: duplicate-window
    description: Every duplicated order was placed between 12 and 19 August 2025
    query: |
      SELECT COUNT(*) FROM orders
      WHERE payment_ref IN (SELECT payment_ref FROM orders GROUP BY payment_ref HAVING COUNT(*) > 1)
        AND (ordered_at < '2025-08-12' OR ordered_at >= '2025-08-20')
    practice: { equals: 0 }
  - id: orders-change
    description: Orders fell by about 10% (duplicates removed)
    query: |
      WITH o AS (SELECT * FROM orders WHERE status = 'completed' AND order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref))
      SELECT 1.0 * (SELECT COUNT(*) FROM o WHERE substr(ordered_at, 1, 7) = '2025-09')
           / (SELECT COUNT(*) FROM o WHERE substr(ordered_at, 1, 7) = '2025-08') - 1
    practice: { min: -0.12, max: -0.09 }
  - id: aov-august
    description: The average order was about $112 in August (duplicates removed)
    query: |
      SELECT AVG(order_total) FROM orders WHERE status = 'completed' AND substr(ordered_at, 1, 7) = '2025-08'
        AND order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref)
    practice: { min: 111.5, max: 112.5 }
  - id: aov-september
    description: The average order was about $93 in September
    query: SELECT AVG(order_total) FROM orders WHERE status = 'completed' AND substr(ordered_at, 1, 7) = '2025-09'
    practice: { min: 92.5, max: 93.5 }
  - id: appliances-change
    description: Kitchen Appliances revenue fell by about 85%
    query: |
      WITH c AS (
        SELECT p.category,
               SUM(CASE WHEN o.ordered_at < '2025-09-01' THEN oi.quantity * oi.unit_price END) AS aug,
               SUM(CASE WHEN o.ordered_at >= '2025-09-01' THEN oi.quantity * oi.unit_price END) AS sep
        FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id
        WHERE o.status = 'completed' AND o.ordered_at >= '2025-08-01'
          AND o.order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref)
        GROUP BY p.category)
      SELECT sep / aug - 1 FROM c WHERE category = 'Kitchen Appliances'
    practice: { min: -0.86, max: -0.84 }
    hidden: { max: -0.6 }
  - id: other-categories-max
    description: Every other category fell by at least 4%
    query: |
      WITH c AS (
        SELECT p.category,
               SUM(CASE WHEN o.ordered_at < '2025-09-01' THEN oi.quantity * oi.unit_price END) AS aug,
               SUM(CASE WHEN o.ordered_at >= '2025-09-01' THEN oi.quantity * oi.unit_price END) AS sep
        FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id
        WHERE o.status = 'completed' AND o.ordered_at >= '2025-08-01'
          AND o.order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref)
        GROUP BY p.category)
      SELECT MAX(sep / aug - 1) FROM c WHERE category <> 'Kitchen Appliances'
    practice: { max: -0.04 }
  - id: other-categories-min
    description: No other category fell by more than 14%
    query: |
      WITH c AS (
        SELECT p.category,
               SUM(CASE WHEN o.ordered_at < '2025-09-01' THEN oi.quantity * oi.unit_price END) AS aug,
               SUM(CASE WHEN o.ordered_at >= '2025-09-01' THEN oi.quantity * oi.unit_price END) AS sep
        FROM order_items oi JOIN orders o ON o.order_id = oi.order_id JOIN products p ON p.product_id = oi.product_id
        WHERE o.status = 'completed' AND o.ordered_at >= '2025-08-01'
          AND o.order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref)
        GROUP BY p.category)
      SELECT MIN(sep / aug - 1) FROM c WHERE category <> 'Kitchen Appliances'
    practice: { min: -0.14 }
  - id: untouched-channels-min
    description: The untouched channels fell by at most 28%
    query: |
      WITH c AS (
        SELECT channel,
               SUM(CASE WHEN ordered_at < '2025-09-01' THEN order_total END) AS aug,
               SUM(CASE WHEN ordered_at >= '2025-09-01' THEN order_total END) AS sep
        FROM orders
        WHERE status = 'completed' AND ordered_at >= '2025-08-01'
          AND order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref)
        GROUP BY channel)
      SELECT MIN(sep / aug - 1) FROM c WHERE channel IN ('Email', 'Organic Search', 'Direct')
    practice: { min: -0.285 }
  - id: untouched-channels-max
    description: Each untouched channel fell by at least 21%
    query: |
      WITH c AS (
        SELECT channel,
               SUM(CASE WHEN ordered_at < '2025-09-01' THEN order_total END) AS aug,
               SUM(CASE WHEN ordered_at >= '2025-09-01' THEN order_total END) AS sep
        FROM orders
        WHERE status = 'completed' AND ordered_at >= '2025-08-01'
          AND order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref)
        GROUP BY channel)
      SELECT MAX(sep / aug - 1) FROM c WHERE channel IN ('Email', 'Organic Search', 'Direct')
    practice: { max: -0.205 }
  - id: paid-and-social
    description: Paid Search and Social together fell by about 25%
    query: |
      WITH c AS (
        SELECT channel,
               SUM(CASE WHEN ordered_at < '2025-09-01' THEN order_total END) AS aug,
               SUM(CASE WHEN ordered_at >= '2025-09-01' THEN order_total END) AS sep
        FROM orders
        WHERE status = 'completed' AND ordered_at >= '2025-08-01'
          AND order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref)
        GROUP BY channel)
      SELECT SUM(sep) / SUM(aug) - 1 FROM c WHERE channel IN ('Paid Search', 'Social')
    practice: { min: -0.27, max: -0.23 }
  - id: paid-search-half
    description: Paid Search revenue fell by about half
    query: |
      WITH c AS (
        SELECT channel,
               SUM(CASE WHEN ordered_at < '2025-09-01' THEN order_total END) AS aug,
               SUM(CASE WHEN ordered_at >= '2025-09-01' THEN order_total END) AS sep
        FROM orders
        WHERE status = 'completed' AND ordered_at >= '2025-08-01'
          AND order_id IN (SELECT MIN(order_id) FROM orders GROUP BY payment_ref)
        GROUP BY channel)
      SELECT sep / aug - 1 FROM c WHERE channel = 'Paid Search'
    practice: { min: -0.56, max: -0.44 }
  - id: sold-out-appliances
    description: Three kitchen appliances had no stock on every day of September
    query: |
      SELECT COUNT(*) FROM products
      WHERE category = 'Kitchen Appliances'
        AND product_id IN (SELECT product_id FROM inventory_snapshots
                           WHERE units_in_stock = 0 AND snapshot_date >= '2025-09-01'
                           GROUP BY product_id HAVING COUNT(*) >= 28)
    practice: { equals: 3 }
    hidden: { equals: 3 }
  - id: sold-out-all-month
    description: The three appliances were out of stock all 30 days of September
    query: |
      SELECT COUNT(*) FROM products
      WHERE product_name IN ('Aurora Espresso Machine', 'Copperleaf Stand Mixer', 'AeroCrisp Air Fryer')
        AND product_id IN (SELECT product_id FROM inventory_snapshots
                           WHERE units_in_stock = 0 AND snapshot_date >= '2025-09-01'
                           GROUP BY product_id HAVING COUNT(*) = 30)
    practice: { equals: 3 }
  - id: spend-change
    description: Marketing spend was about the same in September
    query: |
      SELECT (SELECT SUM(spend) FROM marketing_monthly WHERE month = '2025-09')
           / (SELECT SUM(spend) FROM marketing_monthly WHERE month = '2025-08') - 1
    practice: { min: -0.04, max: 0.02 }
  - id: sessions-change
    description: Website visits rose by about 3% in September
    query: |
      SELECT 1.0 * (SELECT SUM(sessions) FROM marketing_monthly WHERE month = '2025-09')
           / (SELECT SUM(sessions) FROM marketing_monthly WHERE month = '2025-08') - 1
    practice: { min: 0.02, max: 0.035 }
  - id: test-accounts
    description: There are 3 staff test accounts
    query: SELECT COUNT(*) FROM customers WHERE email LIKE '%@copperleaf.example'
    practice: { equals: 3 }
    hidden: { equals: 3 }
  - id: test-order-count
    description: The test accounts placed 12 orders
    query: SELECT COUNT(*) FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE c.email LIKE '%@copperleaf.example'
    practice: { equals: 12 }
  - id: test-order-total
    description: The test orders are worth $275 in total
    query: SELECT SUM(order_total) FROM orders o JOIN customers c ON c.customer_id = o.customer_id WHERE c.email LIKE '%@copperleaf.example'
    practice: { equals: 275 }
  - id: orders-on-last-day
    description: Orders exist on 30 September (needed for the BETWEEN misconception)
    query: SELECT COUNT(*) FROM orders WHERE status = 'completed' AND ordered_at LIKE '2025-09-30%'
    practice: { min: 1 }
    hidden: { min: 1 }

