id: sql-delivered-category-revenue
title: Delivered Revenue by Category
concepts: [three-table JOIN, GROUP BY, ORDER BY]
lesson: sql-joins
tables: [order_items, orders, products]
orderMatters: true
task: |
  Same as the last level, but finance only counts **Delivered** orders. The order status lives in a **third** table.

  Show each `category` and its delivered sales value (`quantity × unit_price`, **rounded to 2 decimals**), sorted from
  **highest to lowest**.
solution: |
  SELECT p.category, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue
  FROM order_items AS oi
  JOIN orders AS o ON oi.order_id = o.order_id
  JOIN products AS p ON oi.product_id = p.product_id
  WHERE o.status = 'Delivered'
  GROUP BY p.category
  ORDER BY revenue DESC;
hints:
  - "order_items connects to orders (by order_id) and to products (by product_id). You can chain two JOINs."
  - "Add JOIN orders AS o ON oi.order_id = o.order_id, then filter WHERE o.status = 'Delivered'."
  - "FROM order_items AS oi JOIN orders AS o ON oi.order_id = o.order_id JOIN products AS p ON oi.product_id = p.product_id WHERE o.status = 'Delivered' GROUP BY p.category ORDER BY revenue DESC"
explanation: |
  Joins can be chained: each `JOIN … ON` adds one more table. `order_items` sits in the middle, linking orders to
  products. Tables like this, which connect two others, are very common in real databases.
tests:
  reject:
    - "SELECT p.category, ROUND(SUM(oi.quantity * oi.unit_price), 2) AS revenue FROM order_items AS oi JOIN products AS p ON oi.product_id = p.product_id GROUP BY p.category ORDER BY revenue DESC"
    - "SELECT p.category, ROUND(SUM(o.total_amount), 2) AS revenue FROM order_items AS oi JOIN orders AS o ON oi.order_id = o.order_id JOIN products AS p ON oi.product_id = p.product_id WHERE o.status = 'Delivered' GROUP BY p.category ORDER BY revenue DESC"
