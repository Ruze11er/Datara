id: sql-price-bands
title: Price Bands
concepts: [CASE]
lesson: sql-case
tables: [products]
checkColumnNames: true
task: |
  Marketing groups products into price bands. Show each `product_name`, its `price`, and a column `price_band`:

  | Price | `price_band` |
  |---|---|
  | under 25 | `Budget` |
  | 25 up to (but not including) 75 | `Mid-range` |
  | 75 or more | `Premium` |
solution: |
  SELECT product_name,
         price,
         CASE
           WHEN price < 25 THEN 'Budget'
           WHEN price < 75 THEN 'Mid-range'
           ELSE 'Premium'
         END AS price_band
  FROM products;
hints:
  - "CASE lets you choose a value depending on conditions, like if/else."
  - "CASE WHEN condition THEN value WHEN … THEN … ELSE value END. The first true condition wins."
  - "CASE WHEN price < 25 THEN 'Budget' WHEN price < 75 THEN 'Mid-range' ELSE 'Premium' END AS price_band"
explanation: |
  `CASE` checks each `WHEN` from top to bottom and returns the value of the **first** true one, so the second condition
  only needs `price < 75` because cheaper products were already caught. `ELSE` covers everything left. Without `ELSE`,
  unmatched rows would get NULL.
tests:
  accept:
    - "SELECT product_name, price, CASE WHEN price >= 75 THEN 'Premium' WHEN price >= 25 THEN 'Mid-range' ELSE 'Budget' END AS price_band FROM products"
  reject:
    - "SELECT product_name, price, CASE WHEN price < 75 THEN 'Mid-range' WHEN price < 25 THEN 'Budget' ELSE 'Premium' END AS price_band FROM products"
    - "SELECT product_name, price, CASE WHEN price < 25 THEN 'Budget' WHEN price < 75 THEN 'Mid-range' END AS price_band FROM products"
