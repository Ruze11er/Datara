id: sql-band-counts
title: How Many in Each Band?
concepts: [CASE, GROUP BY]
lesson: sql-case
tables: [products]
task: |
  Using the same price bands as the last level (`Budget` under 25, `Mid-range` 25 to under 75, `Premium` 75+),
  show each **band** and the **number of products** in it.
solution: |
  SELECT CASE
           WHEN price < 25 THEN 'Budget'
           WHEN price < 75 THEN 'Mid-range'
           ELSE 'Premium'
         END AS price_band,
         COUNT(*)
  FROM products
  GROUP BY price_band;
hints:
  - "You can group by a calculated column, not just a stored one."
  - "Put the CASE expression in SELECT with an alias, then GROUP BY that alias."
  - "SELECT CASE … END AS price_band, COUNT(*) FROM products GROUP BY price_band;"
explanation: |
  Grouping by a `CASE` expression turns a continuous number (price) into categories you can summarize. Analysts do this
  constantly: age groups, order-size buckets, rating levels. SQLite lets you `GROUP BY` the alias; some databases require
  you to repeat the whole `CASE` expression in `GROUP BY` instead.
tests:
  accept:
    - "SELECT CASE WHEN price < 25 THEN 'Budget' WHEN price < 75 THEN 'Mid-range' ELSE 'Premium' END, COUNT(*) FROM products GROUP BY CASE WHEN price < 25 THEN 'Budget' WHEN price < 75 THEN 'Mid-range' ELSE 'Premium' END"
  reject:
    - "SELECT CASE WHEN price < 25 THEN 'Budget' WHEN price < 75 THEN 'Mid-range' ELSE 'Premium' END AS price_band, COUNT(*) FROM products"
    - "SELECT CASE WHEN price <= 25 THEN 'Budget' WHEN price <= 50 THEN 'Mid-range' ELSE 'Premium' END AS price_band, COUNT(*) FROM products GROUP BY price_band"
