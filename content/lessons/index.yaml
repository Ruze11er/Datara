# Course structure: categories -> modules -> lessons (in reading order).
# Each lesson ID must match a file in this folder: <id>.md

- id: fundamentals
  title: Data Analytics Fundamentals
  description: What data analysts do, how data is organized, and the steps of an analysis.
  modules:
    - id: getting-started
      title: Getting Started
      lessons:
        - fund-what-analysts-do
        - fund-data-and-tables
        - fund-analysis-process

- id: sql
  title: SQL
  description: Ask questions of a database, from your first SELECT to summarizing data.
  modules:
    - id: sql-basics
      title: SQL Basics
      lessons:
        - sql-intro
        - sql-select
        - sql-distinct
        - sql-where
    - id: filtering-sorting
      title: Filtering and Sorting
      lessons:
        - sql-and-or
        - sql-like-null
        - sql-order-limit
    - id: summarizing
      title: Summarizing Data
      lessons:
        - sql-aggregates
        - sql-calculations
    - id: grouping
      title: Grouping Data
      lessons:
        - sql-group-by
        - sql-having
    - id: joining
      title: Joining Tables
      lessons:
        - sql-joins
        - sql-left-join
    - id: transforming
      title: Transforming Data
      lessons:
        - sql-case
        - sql-text-functions
        - sql-dates
    - id: subqueries
      title: Subqueries and CTEs
      lessons:
        - sql-subqueries
        - sql-ctes
    - id: window-functions
      title: Window Functions
      lessons:
        - sql-window-functions
        - sql-window-analytics
    - id: business-analysis
      title: Business Analysis with SQL
      lessons:
        - sql-business-patterns

- id: python
  title: Python for Data Analytics
  description: Python from your first line of code to looping through records, always with data in mind.
  modules:
    - id: python-basics
      title: Python Basics
      lessons:
        - py-intro
        - py-variables
        - py-strings
        - py-types
    - id: python-collections
      title: Lists and Dictionaries
      lessons:
        - py-lists
        - py-dicts
    - id: python-control-flow
      title: Conditions and Loops
      lessons:
        - py-conditions
        - py-loops
    - id: python-functions-cleaning
      title: Functions and Data Cleaning
      lessons:
        - py-functions
        - py-cleaning-data
