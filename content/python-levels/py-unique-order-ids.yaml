id: py-unique-order-ids
title: Duplicate Order IDs
concepts: [duplicates, sets, order]
lesson: py-cleaning-data
task: |
  An export accidentally included some orders twice.

  1. `unique_ids`: each order ID **once**, keeping the order in which they **first appear**
  2. `duplicate_count`: how many entries were duplicates (extra copies)
setup: |
  order_ids = [1004, 1001, 1004, 1002, 1001, 1003]
starter: |
  # 1. unique_ids (keep first-appearance order)
  # 2. duplicate_count
solution: |
  unique_ids = []
  seen = set()
  for order_id in order_ids:
      if order_id not in seen:
          seen.add(order_id)
          unique_ids.append(order_id)
  duplicate_count = len(order_ids) - len(unique_ids)
expect: [unique_ids, duplicate_count]
variants:
  - |
    order_ids = [7, 7, 5]
hints:
  - "set() removes duplicates, but it doesn't keep the original order. You need to keep it."
  - "Loop through the IDs and append each one only if you haven't seen it yet. A set is a fast way to remember what you've seen."
  - "Track seen IDs in a set; append to unique_ids when an ID is new. duplicate_count = len(order_ids) - len(unique_ids)"
explanation: |
  The "seen set" pattern removes duplicates while **keeping order**, which matters when order means something (like arrival time).
  A handy shortcut that also keeps order: `list(dict.fromkeys(order_ids))`. Always count what you removed, so you can report
  "2 duplicate rows were dropped".
tests:
  accept:
    - "unique_ids = list(dict.fromkeys(order_ids))\nduplicate_count = len(order_ids) - len(unique_ids)"
  reject:
    - "unique_ids = sorted(set(order_ids))\nduplicate_count = len(order_ids) - len(unique_ids)"
    - "unique_ids = list(dict.fromkeys(order_ids))\nduplicate_count = 2"
