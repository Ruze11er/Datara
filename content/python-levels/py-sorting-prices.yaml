id: py-sorting-prices
title: Sorting Prices
concepts: [lists, sorted, slicing]
lesson: py-lists
task: |
  You have a list of product prices in no particular order.

  - Create `sorted_prices`: the prices sorted from **lowest to highest**.
  - Create `top_three`: the **3 highest** prices, from highest to lowest.

  Keep the original `prices` list unchanged.
setup: |
  prices = [24.5, 189.0, 9.99, 59.99, 149.5, 34.95]
starter: |
  # Sort the prices, then take the top three
solution: |
  sorted_prices = sorted(prices)
  top_three = sorted(prices, reverse=True)[:3]
expect: [sorted_prices, top_three, prices]
variants:
  - |
    prices = [3.0, 1.0, 2.0, 5.0]
hints:
  - "sorted(list) gives you a new, sorted list and leaves the original alone."
  - "sorted(list, reverse=True) sorts from highest to lowest. [:3] keeps the first 3 items."
  - "sorted_prices = sorted(prices) and top_three = sorted(prices, reverse=True)[:3]"
explanation: |
  `sorted()` returns a **new** list, so `prices` stays as it was. `reverse=True` flips the order.
  `[:3]` is a *slice*: it takes items from the start up to (not including) position 3.
  "Sort, then take the first few" is the Python version of SQL's `ORDER BY ... LIMIT 3`.
tests:
  accept:
    - "sorted_prices = sorted(prices)\ntop_three = sorted_prices[::-1][:3]"
  reject:
    - "sorted_prices = sorted(prices)\ntop_three = sorted(prices)[:3]"
    - "prices.sort()\nsorted_prices = prices\ntop_three = sorted(prices, reverse=True)[:3]"
