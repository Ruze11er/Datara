id: py-price-with-tax
title: Price with Tax
concepts: [arithmetic, order of operations]
lesson: py-variables
task: |
  Prices on the website don't include sales tax. The tax rate is stored as a decimal
  (`0.12` means 12%).

  Create `final_price`: the price **plus** the tax on it.
setup: |
  price = 80.0
  tax_rate = 0.12
starter: |
  # final_price = price plus tax
solution: |
  final_price = price * (1 + tax_rate)
expect: [final_price]
variants:
  - |
    price = 15.5
    tax_rate = 0.07
hints:
  - "The tax amount is price * tax_rate. Add that to the price."
  - "You can write it in one line. Use brackets to control what is calculated first."
  - "final_price = price + price * tax_rate  (or price * (1 + tax_rate))"
explanation: |
  Python follows the usual maths order: `*` and `/` before `+` and `-`. So `price + price * tax_rate` works,
  and so does `price * (1 + tax_rate)`, where the brackets are calculated first.
  Without brackets, `price * 1 + tax_rate` would give a very different answer.
tests:
  accept:
    - "final_price = price + price * tax_rate"
    - "tax = price * tax_rate\nfinal_price = price + tax"
  reject:
    - "final_price = price * 1 + tax_rate"
    - "final_price = price * tax_rate"
